name: Build Custom Cog with Covers

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Cog with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix SVG Template 7.0, Clean Signing & Patch Playlist UI
        run: |
          python3 - << 'EOF'
          import glob, os, re

          # 1. Исправляем баг Xcode 16.4 с SVG
          for svg in glob.glob('**/*.svg', recursive=True):
              with open(svg, 'r', encoding='utf-8', errors='ignore') as f:
                  s = f.read()
              if '7.0' in s:
                  s = s.replace('7.0', '6.0')
                  with open(svg, 'w', encoding='utf-8') as f:
                      f.write(s)

          # 2. Очищаем подписи автора и отключаем Sentry
          for pbx in glob.glob('**/*.pbxproj', recursive=True):
              with open(pbx, 'r', encoding='utf-8', errors='ignore') as f:
                  c = f.read()
              c = re.sub(r'DEVELOPMENT_TEAM = [^;]+;', 'DEVELOPMENT_TEAM = "";', c)
              c = re.sub(r'CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;', c)
              c = re.sub(r'CODE_SIGN_IDENTITY = "[^"]+";', 'CODE_SIGN_IDENTITY = "-";', c)
              c = re.sub(r'"CODE_SIGN_IDENTITY\[sdk=macosx\*\]" = "[^"]+";', '"CODE_SIGN_IDENTITY[sdk=macosx*]" = "-";', c)
              c = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = [^;]+;', 'PROVISIONING_PROFILE_SPECIFIER = "";', c)
              c = c.replace('sentry-cli', 'true || sentry-cli')
              with open(pbx, 'w', encoding='utf-8') as f:
                  f.write(c)

          for sh in glob.glob('Scripts/*.sh'):
              with open(sh, 'r', encoding='utf-8', errors='ignore') as f:
                  sc = f.read()
              if 'sentry' in sc.lower():
                  with open(sh, 'w', encoding='utf-8') as f:
                      f.write('#!/bin/sh\nexit 0\n')

          # 3. Умный поиск свойства обложки
          art_selector = "albumArt"  # Дефолт
          for pe in glob.glob('**/PlaylistEntry.h', recursive=True):
              with open(pe, 'r', encoding='utf-8', errors='ignore') as f:
                  peh = f.read()
              # Если в Cog свойство называется по-другому (например, просто image или cover)
              if 'albumArt' not in peh:
                  match = re.search(r'\(\s*readonly\s*,\s*colis\s*\)\s*NSImage\s*\*\s*([a-zA-Z0-9_]+)', peh)
                  if match:
                      art_selector = match.group(1)
                  elif 'image' in peh.lower():
                      art_selector = 'image'
          print(f"Using art selector: {art_selector}")

          # 4. Увеличиваем высоту строк
          for path in glob.glob('**/PlaylistView.m', recursive=True):
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              if 'awakeFromNib' in content and 'setRowHeight:44.0' not in content:
                  content = re.sub(
                      r'(- \(void\)awakeFromNib\s*\{)',
                      r'\1\n    [self setRowHeight:44.0];',
                      content
                  )
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)

          # 5. Патчим PlaylistCellView.m с динамическим объявлением скрытого метода
          for path in glob.glob('**/PlaylistCellView.m', recursive=True):
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()

              cell_hook = r'''
          - (void)layout {
              #ifdef HAS_ORIG_LAYOUT
              [self orig_layout];
              #else
              [super layout];
              #endif
              
              NSTableView *tv = nil;
              NSView *sv = [self superview];
              while (sv && ![sv isKindOfClass:[NSTableView class]]) {
                  sv = [sv superview];
              }
              if ([sv isKindOfClass:[NSTableView class]]) {
                  tv = (NSTableView *)sv;
                  if ([tv rowHeight] < 44.0) {
                      [tv setRowHeight:44.0];
                  }
              }

              NSString *colId = [[self identifier] lowercaseString];
              if ([colId isEqualToString:@"title"] || [[self superview] isKindOfClass:[NSTableRowView class]]) {
                  if (tv) {
                      NSInteger colIdx = [tv columnForView:self];
                      if (colIdx != -1) {
                          NSTableColumn *col = [[tv tableColumns] objectAtIndex:colIdx];
                          if (![[[col identifier] lowercaseString] isEqualToString:@"title"]) {
                              return;
                          }
                      }
                  }

                  id entry = [self objectValue];
                  NSImage *art = nil;
                  if (entry) {
                      @try {
                          art = [entry valueForKey:@"''' + art_selector + r'''"];
                      } @catch (NSException *e) {
                          art = nil;
                      }
                  }

                  NSImageView *imgView = [self viewWithTag:9991];
                  if (!imgView) {
                      imgView = [[NSImageView alloc] initWithFrame:NSMakeRect(4, (self.bounds.size.height - 36.0) / 2.0, 36, 36)];
                      [imgView setTag:9991];
                      [imgView setImageScaling:NSImageScaleProportionallyUpOrDown];
                      [self addSubview:imgView];
                      
                      // Настраиваем слой строго ПОСЛЕ addSubview, чтобы layer существовал
                      [imgView setWantsLayer:YES];
                      if (imgView.layer) {
                          imgView.layer.cornerRadius = 6.0;
                          imgView.layer.masksToBounds = YES;
                      }
                  } else {
                      [imgView setFrame:NSMakeRect(4, (self.bounds.size.height - 36.0) / 2.0, 36, 36)];
                  }
                  [imgView setImage:art];

                  if (self.textField) {
                      NSRect tf = self.textField.frame;
                      tf.origin.x = 46.0;
                      tf.size.width = MAX(40.0, self.bounds.size.width - 50.0);
                      [self.textField setFrame:tf];
                  }
              }
          }
          '''
              if 'viewWithTag:9991' not in content:
                  # Избегаем ошибки компилятора: внедряем категорию-объявление перед реализацией
                  interface_patch = "\n@interface PlaylistCellView (CustomPatch)\n- (void)orig_layout;\n@end\n"
                  
                  if '- (void)layout' in content:
                      content = content.replace('- (void)layout', '#define HAS_ORIG_LAYOUT 1\n- (void)orig_layout')
                  
                  content = content.replace(
                      '@implementation PlaylistCellView',
                      interface_patch + '\n@implementation PlaylistCellView\n' + cell_hook
                  )
                  
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(content)
          EOF


      - name: Build Cog.app (Native Xcode 16.4)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

          xcodebuild -project Cog.xcodeproj \
            -scheme "Cog" \
            -configuration Release \
            -derivedDataPath "$(pwd)/DerivedData" \
            -quiet \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            ENABLE_APP_SANDBOX=NO \
            REGISTER_APP_GROUPS=NO \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Package & Sign App
        run: |
          mkdir -p ReadyApp
          APP_PATH="$(pwd)/DerivedData/Build/Products/Release/Cog.app"
          echo "Verifying binary inside $APP_PATH/Contents/MacOS/Cog..."
          ls -la "$APP_PATH/Contents/MacOS/"
          # Используем ditto вместо cp -R, чтобы не ломать симлинки фреймворков macOS!
          ditto "$APP_PATH" ReadyApp/Cog.app
          codesign --force --deep --sign - ReadyApp/Cog.app

      - name: Upload Ready App
        uses: actions/upload-artifact@v4
        with:
          name: Cog-With-Covers-macOS
          path: ReadyApp/Cog.app
